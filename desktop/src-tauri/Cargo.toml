[package]
name = "nam-mixer-desktop"
version = "0.3.3"
description = "NAM Mixer desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
base64 = "0.22"

[[bin]]
name = "nam-mixer-desktop"
path = "src/main.rs"
