<svg xmlns="http://www.w3.org/2000/svg" width="960" height="494" viewBox="0 0 960 494" role="img"><rect width="960" height="494" fill="#f5f8fb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#213547}.head{font-weight:700;font-size:18px}.sub{font-size:12px;fill:#56697d}.small{font-size:11px;fill:#465d71}.bold{font-weight:700}.panel{fill:#fff;stroke:#cbd5df;stroke-width:1.2}.accent{fill:#e8f6f2;stroke:#2f8b7d;stroke-width:1.5}.button{fill:#246e65}.btntext{fill:#fff;font-weight:700;font-size:12px}.line{stroke:#cbd5df;stroke-width:1}.tick{font-size:10px;fill:#687889}</style><text x="30" y="40" class="head" text-anchor="start">1 · Add captures</text><text x="30" y="65" class="sub" text-anchor="start">Example layout — not a live file uploader</text><rect x="30" y="88" width="900" height="96" rx="12" class="panel"/><text x="480" y="121" class="bold" text-anchor="middle">Drop your .nam captures here</text><text x="480" y="145" class="small" text-anchor="middle">Multiple files · One amplifier and channel</text><rect x="418" y="154" width="124" height="22" rx="8" class="button"/><text x="480" y="169" class="btntext" text-anchor="middle">Choose files</text><rect x="30" y="200" width="900" height="270" rx="12" class="panel"/><text x="45" y="229" class="bold" text-anchor="start">Marshall JCM800  |  High channel  |  6 captures (example)</text><line x1="45" y1="240" x2="914" y2="240" class="line"/><text x="55" y="263" class="small" text-anchor="start">Capture</text><text x="525" y="263" class="small" text-anchor="start">Physical gain</text><text x="705" y="263" class="small" text-anchor="start">Status</text><line x1="45" y1="292" x2="914" y2="292" class="line"/><text x="55" y="286" class="small" text-anchor="start">JCM800_G1.nam</text><text x="542" y="286" class="small" text-anchor="start">1</text><text x="705" y="286" class="small" text-anchor="start">Ready</text><line x1="45" y1="320" x2="914" y2="320" class="line"/><text x="55" y="314" class="small" text-anchor="start">JCM800_G2.nam</text><text x="542" y="314" class="small" text-anchor="start">2</text><text x="705" y="314" class="small" text-anchor="start">Ready</text><line x1="45" y1="348" x2="914" y2="348" class="line"/><text x="55" y="342" class="small" text-anchor="start">JCM800_G4.nam</text><text x="542" y="342" class="small" text-anchor="start">4</text><text x="705" y="342" class="small" text-anchor="start">Ready</text><line x1="45" y1="376" x2="914" y2="376" class="line"/><text x="55" y="370" class="small" text-anchor="start">JCM800_G5.nam</text><text x="542" y="370" class="small" text-anchor="start">5</text><text x="705" y="370" class="small" text-anchor="start">Ready</text><line x1="45" y1="404" x2="914" y2="404" class="line"/><text x="55" y="398" class="small" text-anchor="start">JCM800_G7.nam</text><text x="542" y="398" class="small" text-anchor="start">7</text><text x="705" y="398" class="small" text-anchor="start">Ready</text><line x1="45" y1="432" x2="914" y2="432" class="line"/><text x="55" y="426" class="small" text-anchor="start">JCM800_G10.nam</text><text x="542" y="426" class="small" text-anchor="start">10</text><text x="705" y="426" class="small" text-anchor="start">Ready</text></svg>