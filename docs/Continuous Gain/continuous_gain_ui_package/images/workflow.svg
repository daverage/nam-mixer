th="40" height="40" rx="20" fill="#e1f4ee"/><text x="537" y="176" class="bold" text-anchor="middle">03</text><text x="517" y="219" class="head" text-anchor="start">Train</text><text x="517" y="258" class="small" text-anchor="start">Reuse established NAM trainer</text><text x="517" y="280" class="small" text-anchor="start">Review epochs and validation</text><path d="M720 237 l12 0 m-5 -5 l5 5 -5 5" stroke="#2f8b7d" fill="none" stroke-width="2"/><rect x="736" y="130" width="215" height="218" rx="12" class="panel"/><rect x="751" y="150" width="40" height="40" rx="20" fill="#e1f4ee"/><text x="771" y="176" class="bold" text-anchor="middle">04</text><text x="751" y="219" class="head" text-anchor="start">Test &amp; export</text><text x="751" y="258" class="small" text-anchor="start">Audition the full Input sweep</text><text x="751" y="280" class="small" text-anchor="start">Export one standard .nam</text><rect x="34" y="387" width="900" height="75" rx="12" class="accent"/><text x="52" y="416" class="bold" text-anchor="start">Product check</text><text x="52" y="439" class="small" text-anchor="start">Can one NAM cover the useful amp range through the player Input knob, without switching captures?</text></svg>