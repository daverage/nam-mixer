name: Build standalone desktop app

# Packages the Flask app + pywebview launcher (desktop/main.py) into a
# double-clickable app for Windows, macOS, and Linux via PyInstaller -- see
# docs/standalone_packaging.md. Each platform must build its own binary
# (PyInstaller does not cross-compile), so this always builds nam_render
# from source on the same runner rather than depending on the separate
# build-nam-render.yml release artifacts, keeping this workflow self
# contained and runnable on any commit, not just release tags.
#
# - On every push/PR touching desktop/, hybrid/, app.py, templates/,
#   static/, or this workflow: build-only smoke test on all three
#   platforms.
# - On a pushed tag matching `desktop-v*`: also uploads each platform's
#   packaged app as a release asset.
# - `workflow_dispatch` allows a manual one-off run.

permissions:
  contents: write

on:
  push:
    branches: [master]
    paths:
      - "desktop/**"
      - "hybrid/**"
      - "app.py"
      - "templates/**"
      - "static/**"
      - "native/nam_render/**"
      - ".github/workflows/build-desktop.yml"
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "desktop/**"
      - "hybrid/**"
      - "app.py"
      - "templates/**"
      - "static/**"
      - "native/nam_render/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: NAMMixer-linux-x64.tar.gz
          - os: macos-latest
            asset_name: NAMMixer-macos-arm64.zip
          - os: windows-latest
            asset_name: NAMMixer-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build nam_render
        run: |
          cmake -B native/nam_render/build -S native/nam_render -DCMAKE_BUILD_TYPE=Release
          cmake --build native/nam_render/build --config Release --target nam_render

      - name: Install desktop packaging dependencies
        run: pip install -r requirements-desktop.txt

      - name: Package with PyInstaller
        run: pyinstaller desktop/build.spec --noconfirm

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent NAMMixer.app "../${{ matrix.asset_name }}"

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "${{ matrix.asset_name }}" NAMMixer

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/NAMMixer/* -DestinationPath "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
