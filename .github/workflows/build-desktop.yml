
name: Build desktop release

# Version tags (for example v0.2.0) build and publish a GitHub Release.
# Manual runs build downloadable artifacts without publishing a release.
#
# Platforms:
#   macOS arm64: .dmg
#   Linux x64:   .deb and .AppImage
#   Windows x64: .msi and NSIS .exe
#
# Linux DEB and AppImage packaging are separate steps so AppImage failures
# can be diagnosed without losing the successfully built DEB artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            bundles: app,dmg

          - name: Linux x64
            os: ubuntu-24.04
            bundles: deb,appimage

          - name: Windows x64
            os: windows-latest
            bundles: msi,nsis

    runs-on: ${{ matrix.os }}

    steps:
      # ------------------------------------------------------------
      # 1. Checkout and build environment
      # ------------------------------------------------------------

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # ------------------------------------------------------------
      # 2. Install Linux system dependencies
      #
      # Install these before compiling the native renderer so both
      # the renderer and Tauri have their required build libraries.
      # ------------------------------------------------------------

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            file \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libfuse2t64 \
            librsvg2-dev \
            patchelf

          echo "GTK version:"
          pkg-config --modversion gdk-3.0

          echo "WebKitGTK version:"
          pkg-config --modversion webkit2gtk-4.1

          echo "FUSE libraries:"
          ldconfig -p | grep -E 'libfuse\.so|libfuse3\.so' || true

      # ------------------------------------------------------------
      # 3. Build the Python backend and native NAM renderer
      # ------------------------------------------------------------

      - name: Install backend build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build native renderer
        run: |
          cmake -B native/nam_render/build -S native/nam_render -DCMAKE_BUILD_TYPE=Release
          cmake --build native/nam_render/build --config Release --target nam_render --parallel

      - name: Package backend
        run: >-
          python -m PyInstaller packaging/backend/nam_mixer_backend.spec
          --distpath packaging/backend/dist
          --workpath packaging/backend/build
          --noconfirm

      # ------------------------------------------------------------
      # 4. Install Tauri CLI
      # ------------------------------------------------------------

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # ------------------------------------------------------------
      # 5. macOS build and packaging
      #
      # Retains the existing working ad-hoc signing process.
      # ------------------------------------------------------------

      - name: Remove stale macOS bundle output
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri
        run: rm -rf target/release/bundle

      - name: Build signed macOS app
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles app

      - name: Verify macOS ad-hoc signature before DMG packaging
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find target/release/bundle/macos \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            -print -quit)"

          test -n "$APP_PATH" || {
            echo "No macOS .app bundle was produced" >&2
            exit 1
          }

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          SIGNING_INFO="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)"

          printf '%s\n' "$SIGNING_INFO"

          printf '%s\n' "$SIGNING_INFO" | grep -q '^Signature=adhoc$' || {
            echo "Expected an ad-hoc macOS signature" >&2
            exit 1
          }

      - name: Package DMG from verified macOS app
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri
        run: cargo tauri bundle --bundles dmg

      - name: Verify macOS DMG output
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail

          DMG_PATH="$(find target/release/bundle/dmg \
            -maxdepth 1 \
            -type f \
            -name '*.dmg' \
            -print -quit)"

          test -n "$DMG_PATH" || {
            echo "No macOS DMG was produced" >&2
            exit 1
          }

          hdiutil verify "$DMG_PATH"

      - name: Verify application inside macOS DMG
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail

          DMG_PATH="$(find target/release/bundle/dmg \
            -maxdepth 1 \
            -type f \
            -name '*.dmg' \
            -print -quit)"

          test -n "$DMG_PATH"

          MOUNT_DIR="$(mktemp -d)"

          cleanup() {
            hdiutil detach "$MOUNT_DIR" -quiet || true
            rmdir "$MOUNT_DIR" || true
          }

          trap cleanup EXIT

          hdiutil attach "$DMG_PATH" \
            -mountpoint "$MOUNT_DIR" \
            -nobrowse \
            -readonly

          APP_PATH="$(find "$MOUNT_DIR" \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            -print -quit)"

          test -n "$APP_PATH" || {
            echo "No application found inside DMG" >&2
            exit 1
          }

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          echo "DMG contains a correctly signed application"

      # ------------------------------------------------------------
      # 6. Windows build and packaging
      #
      # Retains the existing working MSI and NSIS build command.
      # ------------------------------------------------------------

      - name: Build Windows installers
        if: runner.os == 'Windows'
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles msi,nsis

      # ------------------------------------------------------------
      # 7. Linux build and packaging
      #
      # IMPORTANT:
      #
      # Build the executable and DEB first.
      # Upload the DEB before attempting AppImage packaging.
      #
      # If AppImage packaging fails, the DEB artifact remains
      # available from the GitHub Actions run.
      # ------------------------------------------------------------

      - name: Build Linux executable and DEB
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail

          cargo tauri build --bundles deb --verbose

      - name: Verify Linux executable and DEB
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail

          EXECUTABLE="target/release/nam-mixer-desktop"

          test -f "$EXECUTABLE" || {
            echo "Linux desktop executable not found" >&2
            exit 1
          }

          test -x "$EXECUTABLE" || {
            echo "Linux desktop executable is not executable" >&2
            exit 1
          }

          DEB_PATH="$(find target/release/bundle/deb \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -print -quit)"

          test -n "$DEB_PATH" || {
            echo "Linux DEB installer not found" >&2
            exit 1
          }

          echo "Linux executable:"
          ls -lh "$EXECUTABLE"

          echo "Debian installer:"
          ls -lh "$DEB_PATH"

          echo "Debian package metadata:"
          dpkg-deb --info "$DEB_PATH"

      # Upload the DEB immediately.
      # It remains downloadable even if AppImage packaging fails.

      - name: Upload Linux DEB
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nam-mixer-linux-x64-deb
          path: desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 8. Linux AppImage packaging
      #
      # Reuse the compiled Linux executable.
      #
      # Enable verbose Tauri logging to help identify the underlying
      # linuxdeploy error.
      #
      # APPIMAGE_EXTRACT_AND_RUN allows compatible AppImage tools to
      # execute through extraction when direct FUSE mounting fails.
      # ------------------------------------------------------------

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          RUST_LOG: "tauri_bundler=debug"
        run: |
          set -euo pipefail

          echo "Building Linux AppImage"

          echo "AppImage extraction mode:"
          echo "$APPIMAGE_EXTRACT_AND_RUN"

          echo "Linux environment:"
          uname -a

          echo "FUSE availability:"
          ls -l /dev/fuse || true

          echo "AppImage packaging dependencies:"
          command -v file
          command -v patchelf
          command -v pkg-config

          echo "Starting Tauri AppImage packaging"

          cargo tauri bundle --bundles appimage --verbose

      - name: Verify Linux AppImage
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail

          APPIMAGE_PATH="$(find target/release/bundle/appimage \
            -maxdepth 1 \
            -type f \
            -name '*.AppImage' \
            -print -quit)"

          test -n "$APPIMAGE_PATH" || {
            echo "Linux AppImage not found" >&2
            exit 1
          }

          test -s "$APPIMAGE_PATH" || {
            echo "Linux AppImage is empty" >&2
            exit 1
          }

          chmod +x "$APPIMAGE_PATH"

          echo "AppImage generated:"
          ls -lh "$APPIMAGE_PATH"

          echo "AppImage file type:"
          file "$APPIMAGE_PATH"

      # ------------------------------------------------------------
      # 9. Upload completed installers
      # ------------------------------------------------------------

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nam-mixer-linux-x64-appimage
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nam-mixer-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: nam-mixer-macos-arm64
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------
  # 10. Publish GitHub Release
  #
  # Only version tags publish a release.
  # All platform builds must succeed.
  #
  # A failed Linux AppImage build does not prevent the completed
  # Linux DEB artifact from being downloaded from GitHub Actions,
  # but it does prevent publication of an incomplete GitHub Release.
  # --------------------------------------------------------------

  release:
    name: Publish GitHub release

    if: startsWith(github.ref, 'refs/tags/v')

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Release assets:"

          find release-assets \
            -maxdepth 2 \
            -type f \
            -print

      - name: Attach installers to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**
